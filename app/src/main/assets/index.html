<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #061329;
    font-family: Arial, sans-serif;
}

.calculator {
    width: 340px;
    padding: 25px;
    border-radius: 25px;
    background: #0b1b32;
    border: 1px solid silver;
    box-shadow: 0 0 30px #007bff55;
}

h2 {
    text-align: center;
    color: silver;
    letter-spacing: 3px;
}

#display {
    width: 100%;
    height: 75px;
    margin-bottom: 20px;
    background: #020a17;
    border: 1px solid #168cff;
    border-radius: 12px;
    color: #fff;
    font-size: 30px;
    text-align: right;
    padding: 15px;
    outline: none;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

button {
    height: 60px;
    border: 1px solid silver;
    border-radius: 12px;
    background: linear-gradient(145deg,#dce4ed,#8798ad);
    color: #07172b;
    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: scale(1.06);
    box-shadow: 0 0 15px #168cff;
}

.operator {
    background: #123b64;
    color: #50baff;
}

.clear {
    background: #a52e42;
    color: white;
}

.equal {
    grid-column: span 2;
    background: #087eea;
    color: white;
}
</style>
</head>
<body>

<div class="calculator">
    <h2>CALCULATOR</h2>

    <input id="display" value="0" readonly>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="operator" onclick="deleteLast()">DEL</button>
        <button class="operator" onclick="add('%')">%</button>
        <button class="operator" onclick="add('/')">÷</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button class="operator" onclick="add('*')">×</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button class="operator" onclick="add('-')">−</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button class="operator" onclick="add('+')">+</button>

        <button onclick="add('0')">0</button>
        <button onclick="add('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
const display = document.getElementById("display");

function add(value) {
    if (display.value === "0" || display.value === "Error") {
        display.value = value;
    } else {
        display.value += value;
    }
}

function clearDisplay() {
    display.value = "0";
}

function deleteLast() {
    display.value = display.value.slice(0, -1) || "0";
}

function calculate() {
    try {
        const expression = display.value;

        if (!/^[0-9+\-*/.()% ]+$/.test(expression)) {
            throw Error();
        }

        const result = Function(
            '"use strict"; return (' + expression + ')'
        )();

        if (!Number.isFinite(result)) {
            throw Error();
        }

        display.value = Number(result.toFixed(10));
    } catch {
        display.value = "Error";
    }
}
</script>

</body>
</html>
